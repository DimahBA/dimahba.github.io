<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
	<!-- Dusk over the front line, for the Operation Serval hero. The scene is
	     drawn wider than its viewBox (-700 to 2300) so it can be re-framed
	     without running out of hills; the page crops it with object-fit. -->
	<style>
		/* The sunlit edge on the tanks facing the sun: a copy of the
		   silhouette, nudged towards the light and painted behind it. */
		.dx-rim { fill: #b8651f; opacity: 0.7; }
	</style>
	<defs>
